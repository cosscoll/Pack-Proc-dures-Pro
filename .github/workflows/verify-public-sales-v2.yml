name: Recette réelle du site 3D en production
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/verify-public-sales-v2.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/sales-hero-browser.mjs'
      - '.github/workflows/verify-public-sales-v2.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-sales:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier les marqueurs de la nouvelle version en HTTP réel
        run: |
          set -e
          for i in {1..18}; do
            if curl -fsSL --max-time 15 https://cosscoll.github.io/Pack-Proc-dures-Pro/ | grep -q 'Mobile first impression'; then
              echo 'PUBLIC_V2_MARKER_CONFIRMED'
              exit 0
            fi
            echo "Attente déploiement : tentative $i"
            sleep 10
          done
          echo "::error::La nouvelle vitrine V2 n'est pas servie publiquement."
          exit 1
      - name: Vérifier le WebGL, les survols et le comparateur sur GitHub Pages
        env:
          SALES_BASE: https://cosscoll.github.io/Pack-Proc-dures-Pro/
        run: node tests/sales-hero-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: premiere-page-publique-business01
          path: screenshots/sales-hero-*.png
          if-no-files-found: ignore
          retention-days: 7
