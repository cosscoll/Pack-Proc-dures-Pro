name: Cycle de vie WebGL et animations réduites — Business 01
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/motion-browser.mjs'
      - '.github/workflows/verify-webgl-lifecycle.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  motion:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium pour la recette isolée
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester le changement en direct des préférences et du contexte graphique
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/lifecycle-server.log 2>&1 &
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/motion-browser.mjs
