name: Vérifier la reproduction indépendante de la clé 3D et du coffre
on:
  pull_request:
    branches: [main]
    paths:
      - 'reproduction-3d/**'
      - '.github/workflows/verify-reproduction-3d.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduction:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la syntaxe du nouveau contrôleur et du module d'origine
        run: |
          node --check reproduction-3d/demo.js
          node --check reproduction-3d/sources_exactes/assets/apartment-scene.js
          node --check reproduction-3d/verify-demo.mjs
      - name: Essayer le vrai script du dossier outil sur un runner connecté
        run: |
          python3 reproduction-3d/outils_kit/outil_scripts/recuperer_sources.py
          python3 reproduction-3d/outils_kit/outil_scripts/verifier_sources.py
          python3 reproduction-3d/outils_kit/outil_scripts/tester_mathematiques.py
      - name: Installer Chromium et WebGL logiciel
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Démarrer la démonstration en HTTP
        run: |
          python3 -m http.server 8789 --bind 127.0.0.1 >/tmp/reproduction-3d-http.log 2>&1 &
          for i in {1..20}; do
            curl -fsS http://127.0.0.1:8789/reproduction-3d/index.html >/dev/null && break
            sleep 1
          done
      - name: Rejouer le scroll, les sept poses, l'ouverture et la fermeture du coffre
        run: node reproduction-3d/verify-demo.mjs
      - name: Assembler le mini-site autonome pour téléchargement
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile, ZIP_DEFLATED
          with ZipFile('reproduction-3d-site.zip','w',ZIP_DEFLATED) as f:
              for p in sorted(Path('reproduction-3d').rglob('*')):
                  if p.is_file(): f.write(p,p)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mini-site-reproduction-cle-coffre
          path: reproduction-3d-site.zip
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preuve-reproduction-site-cle-et-coffre
          path: screenshots/reproduction-3d-*.png
          if-no-files-found: ignore
          retention-days: 7
