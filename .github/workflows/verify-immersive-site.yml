name: Vérification site immersif — Business 01
on:
  pull_request:
    paths:
      - 'index.html'
      - 'tests/check_site.py'
      - '.github/workflows/verify-immersive-site.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/check_site.py'
      - '.github/workflows/verify-immersive-site.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Vérifier la page statique et le script WebGL
        run: python3 -m unittest discover -s tests -p 'check_site.py' -v
