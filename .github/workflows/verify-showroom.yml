name: Vitrine interactive — aperçu du contenu produit
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/showroom-browser.mjs'
      - '.github/workflows/verify-showroom.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/showroom-browser.mjs'
      - '.github/workflows/verify-showroom.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  showroom:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium pour QA en CI
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Tester le présentoir 3D, l'affichage des formats et la gestuelle tactile
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/qa-showroom.log 2>&1 &
          for n in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ > /dev/null; then break; fi
            sleep 1
          done
          node tests/showroom-browser.mjs
      - name: Contrôler les pages effectivement servies par GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          for n in {1..15}; do
            code=$(curl -L -sS --max-time 20 -o /tmp/showroom-live.html -w '%{http_code}' "$url" || true)
            if [[ "$code" == '200' ]] &&
               grep -q 'id="showroomStage"' /tmp/showroom-live.html &&
               grep -q 'data-view="pilotage"' /tmp/showroom-live.html &&
               grep -q 'Mobile first impression' /tmp/showroom-live.html; then
              echo 'SHOWROOM_LIVE_HTML_VERIFIED HTTP=200'
              break
            fi
            if [[ "$n" == '15' ]]; then
              echo '::error::Le présentoir ou la correction mobile ne sont pas encore servis depuis GitHub Pages.'
              exit 1
            fi
            sleep 10
          done
          SHOWROOM_BASE="$url" node tests/showroom-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apercu-showroom-3d
          path: screenshots/showroom-*.png
          if-no-files-found: ignore
          retention-days: 7
