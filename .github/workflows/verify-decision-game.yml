name: Expérience métier interactive — recette navigateur
on:
  pull_request:
    branches: [main]
    paths:
      - 'atelier-decisions.html'
      - 'tests/decision-game-browser.mjs'
      - '.github/workflows/verify-decision-game.yml'
  push:
    branches: [main]
    paths:
      - 'atelier-decisions.html'
      - 'tests/decision-game-browser.mjs'
      - '.github/workflows/verify-decision-game.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  game:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium et axe-core pour la recette
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Tester les scénarios, les interactions, l'accessibilité et les formats mobiles
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/decision-game.log 2>&1 &
          for n in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/atelier-decisions.html > /dev/null; then break; fi
            sleep 1
          done
          node tests/decision-game-browser.mjs
      - name: Attendre l'atelier et son CTA sur GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          base='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          for attempt in {1..15}; do
            home=$(curl -fLsS --max-time 20 "$base" || true)
            game=$(curl -fLsS --max-time 20 "${base}atelier-decisions.html" || true)
            if [[ "$home" == *'href="./atelier-decisions.html"'* ]] &&
               [[ "$game" == *'id="choices"'* ]] &&
               [[ "$game" == *'id="restart"'* ]]; then
              echo 'DECISION_PUBLIC_HTML_VERIFIED HTTP=200'
              break
            fi
            if [[ "$attempt" -eq 15 ]]; then
              echo "::error::Le jeu et son lien ne sont pas encore en ligne."
              exit 1
            fi
            sleep 10
          done
      - name: Tester les choix sur le véritable site public
        env:
          DECISION_BASE: https://cosscoll.github.io/Pack-Proc-dures-Pro/
        run: node tests/decision-game-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atelier-decisions-captures
          path: screenshots/atelier-decisions-*.png
          if-no-files-found: ignore
          retention-days: 7
