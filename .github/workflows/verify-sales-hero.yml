name: Vitrine commerciale 3D — recette navigateur
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/sales-hero-browser.mjs'
      - '.github/workflows/verify-sales-hero.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/sales-hero-browser.mjs'
      - '.github/workflows/verify-sales-hero.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  sales-hero:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Contrôler l'interface de la branche et son comportement réel
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/hero-server.log 2>&1 &
          for n in {1..20}; do
            if curl --fail --silent http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/sales-hero-browser.mjs
      - name: Attendre la publication de la version mobile réelle
        if: github.event_name != 'pull_request'
        run: |
          for n in {1..18}; do
            if curl -fsSL --max-time 15 https://cosscoll.github.io/Pack-Proc-dures-Pro/ | grep -q 'Mobile first impression'; then
              echo 'PUBLIC_HERO_VERSION_FOUND'
              exit 0
            fi
            sleep 10
          done
          echo "::error::Nouvelle version non publiée sur GitHub Pages"
          exit 1
      - name: Vérifier le site public après fusion et déploiement
        if: github.event_name != 'pull_request'
        env:
          SALES_BASE: https://cosscoll.github.io/Pack-Proc-dures-Pro/
        run: node tests/sales-hero-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-refonte-commerciale
          path: screenshots/sales-hero-*.png
          if-no-files-found: ignore
          retention-days: 7
