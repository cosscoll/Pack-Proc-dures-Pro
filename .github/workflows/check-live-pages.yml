name: Vérification HTTP GitHub Pages — Business 01
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/check-live-pages.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'exemple-procedure.html'
      - '.github/workflows/check-live-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-site:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Contrôler le HTML réellement servi par GitHub Pages
        shell: bash
        run: |
          set -euo pipefail
          url='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          echo "Vérification de $url"
          for attempt in {1..12}; do
            code=$(curl --location --silent --show-error --max-time 12 --output /tmp/pack-pro.html --write-out '%{http_code}' "$url" || true)
            bytes=$(wc -c </tmp/pack-pro.html 2>/dev/null || echo 0)
            if [[ "$code" == '200' ]] && grep -q 'id="processCanvas"' /tmp/pack-pro.html && grep -q 'id="orientation"' /tmp/pack-pro.html && grep -q 'id="laboratoire"' /tmp/pack-pro.html; then
              echo "PUBLIC_SITE_VERIFIED: HTTP=$code bytes=$bytes; nouvelle scène et orientation présentes."
              exit 0
            fi
            echo "Tentative $attempt/12 : HTTP=$code; bytes=$bytes; contenu encore absent ou inaccessible."
            sleep 10
          done
          echo "::error::GitHub Pages ne sert pas encore la refonte. Vérifier la configuration Settings > Pages, la branche publiée et les journaux de déploiement."
          exit 1

      - name: Contrôler l'échantillon P01 publié et son lien depuis l'accueil
        shell: bash
        run: |
          set -euo pipefail
          base='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          sample="${base}exemple-procedure.html"
          for attempt in {1..12}; do
            sample_code=$(curl --location --silent --show-error --max-time 12 --output /tmp/pack-pro-sample.html --write-out '%{http_code}' "$sample" || true)
            home_code=$(curl --location --silent --show-error --max-time 12 --output /tmp/pack-pro-home.html --write-out '%{http_code}' "$base" || true)
            if [[ "$sample_code" == '200' ]] && [[ "$home_code" == '200' ]] &&
                grep -q 'data-step="7"' /tmp/pack-pro-sample.html &&
                grep -q 'id="progress"' /tmp/pack-pro-sample.html &&
                grep -q 'exemple-procedure.html' /tmp/pack-pro-home.html; then
              echo "PUBLIC_SAMPLE_VERIFIED: sample HTTP=$sample_code home HTTP=$home_code; 7 étapes et lien catalogue présents."
              exit 0
            fi
            echo "Attente version publique: tentative $attempt/12; sample HTTP=$sample_code home HTTP=$home_code."
            sleep 10
          done
          echo "::error::La procédure pilote P01 ou son lien ne sont pas encore accessibles sur GitHub Pages."
          exit 1
