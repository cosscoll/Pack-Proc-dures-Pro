name: Recette du menu mobile compact — Business 01
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/mobile-nav-browser.mjs'
      - '.github/workflows/verify-mobile-nav.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/mobile-nav-browser.mjs'
      - '.github/workflows/verify-mobile-nav.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  mobile-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Contrôler la navigation, l'accessibilité clavier et l'absence de JS
        run: |
          python3 -m http.server 8787 --bind 127.0.0.1 >/tmp/qa-menu.log 2>&1 &
          for n in {1..20}; do
            if curl -fsS http://127.0.0.1:8787/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/mobile-nav-browser.mjs
      - name: Vérifier le menu et l'atelier sur GitHub Pages réel
        shell: bash
        run: |
          set -euo pipefail
          base='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          for i in {1..15}; do
            html=$(curl -fLsS --max-time 20 "$base" || true)
            if [[ "$html" == *'id="menuToggle"'* ]] &&
               [[ "$html" == *'atelier-decisions.html'* ]] &&
               [[ "$html" == *'id="heroCanvas"'* ]]; then
              echo 'PUBLIC_MOBILE_MENU_VERIFIED HTTP=200'
              break
            fi
            if [[ "$i" == 15 ]]; then echo "::error::Menu mobile ou atelier non publié"; exit 1; fi
            sleep 10
          done
          NAV_BASE="$base" node tests/mobile-nav-browser.mjs
