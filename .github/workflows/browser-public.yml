name: Recette navigateur du site public — Business 01
on:
  pull_request:
    branches: [main]
    paths:
      - 'tests/live-browser.mjs'
      - '.github/workflows/browser-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser-public:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer un navigateur de recette (dépendance CI éphémère)
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Recette du site GitHub Pages (responsive, orientation, WebGL/repli, scénario)
        run: node tests/live-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-site-public
          path: screenshots/*.png
          if-no-files-found: ignore
          retention-days: 7
