name: Recette de la nouvelle expérience sur GitHub Pages réel
on:
  pull_request:
    branches: [main]
    paths: ['.github/workflows/verify-public-cinematic.yml']
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/apartment-scene.js'
      - 'assets/cinematic.css'
      - 'assets/experience.js'
      - '.github/workflows/verify-public-cinematic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-experience:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Installer Chromium WebGL2
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Vérifier que la vraie nouvelle page est servie en HTTP 200
        shell: bash
        run: |
          set -euo pipefail
          url='https://cosscoll.github.io/Pack-Proc-dures-Pro/'
          for n in {1..18}; do
            code=$(curl -L -sS --max-time 15 -o /tmp/public-cinematic.html -w '%{http_code}' "$url" || true)
            if [[ "$code" == '200' ]] &&
               grep -q 'id="worldCanvas"' /tmp/public-cinematic.html &&
               grep -q 'id="depart"' /tmp/public-cinematic.html &&
               grep -q 'assets/apartment-scene.js' /tmp/public-cinematic.html; then
              echo 'PUBLIC_CINEMATIC_HTML_VERIFIED HTTP=200'
              break
            fi
            if [[ "$n" == '18' ]]; then echo '::error::La refonte cinématographique n’est pas encore en ligne';exit 1;fi
            sleep 10
          done
      - name: Tester les vrais interactions publiques bureau et mobile
        env:
          CINEMATIC_BASE: https://cosscoll.github.io/Pack-Proc-dures-Pro/
        run: node tests/cinematic-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: captures-cinematic-public
          path: screenshots/cinematic-*.png
          if-no-files-found: ignore
          retention-days: 7
