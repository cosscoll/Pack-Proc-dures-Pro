name: UX audit — conversion & accessibility
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ux-audit.yml'
      - 'tests/ux-audit.mjs'
      - 'index.html'
      - 'pack-conciergerie.html'
      - 'assets/cinematic.css'
      - 'assets/pack-conciergerie.css'
permissions:
  contents: read
jobs:
  ux:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright and axe-core
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.11.0
          npx playwright install --with-deps chromium
      - name: Audit the deployed user journey
        run: node tests/ux-audit.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ux-audit-screenshots
          path: screenshots/audit/
          retention-days: 7
