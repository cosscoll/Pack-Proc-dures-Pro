name: Audit accessibilité et performances — Business 01
on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'exemple-procedure.html'
      - 'tests/a11y-vitals-public.mjs'
      - '.github/workflows/a11y-vitals.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 13
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Préparer axe-core et Chromium sans licence commerciale
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1 @axe-core/playwright@4.10.2
          npx playwright install --with-deps chromium
      - name: Vérifier WCAG et mesurer LCP/CLS en laboratoire
        run: node tests/a11y-vitals-public.mjs
